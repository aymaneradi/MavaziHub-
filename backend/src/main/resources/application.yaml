spring:
  application:
    name: mavazihub-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:mavazihub}
    username: ${POSTGRES_USER:mavazihub_user}
    password: ${POSTGRES_PASSWORD:mavazihub_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-expiration: 900000
      refresh-token-expiration: 604800000

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
