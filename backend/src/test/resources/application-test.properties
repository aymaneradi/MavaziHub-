spring.datasource.url=jdbc:h2:mem:mavazihub_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

application.security.jwt.secret-key=local-test-secret-key-with-at-least-thirty-two-chars
application.security.jwt.access-token-expiration=900000
application.security.jwt.refresh-token-expiration=604800000
