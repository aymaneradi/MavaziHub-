services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mavazihub}
      POSTGRES_USER: ${POSTGRES_USER:-mavazihub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mavazihub_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mavazihub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mavazihub_user} -d ${POSTGRES_DB:-mavazihub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mavazihub-network

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mavazihub}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mavazihub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mavazihub_password}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY muss in .env gesetzt sein}
      MAVAZIHUB_MEDIA_DIR: /app/media
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - mavazihub_media:/app/media
    networks:
      - mavazihub-network

  frontend:
    build:
      context: ./frontend/frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - mavazihub-network

volumes:
  mavazihub_postgres_data:
  mavazihub_media:

networks:
  mavazihub-network:
    driver: bridge
